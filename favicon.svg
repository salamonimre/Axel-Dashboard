<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c8a69"/><stop offset="1" stop-color="#0d5c47"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2a24a"/><stop offset="1" stop-color="#c47c25"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c47c25"/><stop offset="1" stop-color="#92561a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- ears: long, wavy, hanging -->
  <path d="M19 24c-6 2-9 12-8 21 1 7 5 11 9 10 4-1 6-6 6-12l0-14z" fill="url(#ear)"/>
  <path d="M45 24c6 2 9 12 8 21-1 7-5 11-9 10-4-1-6-6-6-12l0-14z" fill="url(#ear)"/>
  <!-- head -->
  <path d="M32 13c-9 0-15 6-15 15 0 10 5 20 15 20s15-10 15-20c0-9-6-15-15-15z" fill="url(#fur)"/>
  <!-- topknot highlight -->
  <path d="M24 20c3-4 13-4 16 0" fill="none" stroke="#f0c377" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>
  <!-- eyes -->
  <circle cx="26" cy="28" r="2.3" fill="#1d1612"/><circle cx="38" cy="28" r="2.3" fill="#1d1612"/>
  <circle cx="26.8" cy="27.2" r=".7" fill="#fff"/><circle cx="38.8" cy="27.2" r=".7" fill="#fff"/>
  <!-- muzzle -->
  <ellipse cx="32" cy="38" rx="8" ry="6.5" fill="#f3d09a"/>
  <!-- tongue -->
  <path d="M28.5 41c0 4 1.5 6.5 3.5 6.5s3.5-2.5 3.5-6.5z" fill="#e2607a"/>
  <path d="M32 41v5" stroke="#c94a66" stroke-width=".9"/>
  <!-- nose -->
  <path d="M27.5 35.5c0-2.3 2-3.5 4.5-3.5s4.5 1.2 4.5 3.5c0 2-2 3.3-4.5 3.3s-4.5-1.3-4.5-3.3z" fill="#1d1612"/>
  <circle cx="30.5" cy="34.6" r=".8" fill="#fff" opacity=".6"/>
</svg>
